app.cors.enabled=true

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/globetrottr}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JWT (its key only for development, it won't be used in prod)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Google
google.client.id=${GOOGLE_SECRET:APIKEY}

# Mail sender (mailtrap is for testing, use Google for prod)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
app.mail.from=${MAIL_FROM:no-reply@your.app}
spring.mail.username=${MAIL_USERNAME:USERNAME}
spring.mail.password=${MAIL_PASSWORD:PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true